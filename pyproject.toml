[project]
name = "pixelstore"
version = "1.0.0"
description = "Telegram digital subscription shop: customer bot, Mini App storefront and web admin console"
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
# Undefined names in a bot handler only surface when a customer taps that button, so the linter
# that catches them is part of the project, not something each machine installs on its own.
# Install with: pip install -e ".[dev]"   Check with: ruff check app tests scripts
dev = ["ruff==0.16.8"]

[tool.pytest.ini_options]
# The pytest console script does not add the repository root to sys.path.
# Keep CI and `python -m pytest` consistent when importing the app package.
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["console", ".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# FastAPI declares dependencies as function-call defaults (Depends, Query, Body).
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "support"]

[tool.ruff.format]
quote-style = "preserve"
